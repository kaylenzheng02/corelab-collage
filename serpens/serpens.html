<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Serpens Nebula · Sky map</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.3/400.css">
    <link rel="stylesheet" href="serpens.css">
    <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
    <script src="serpens.js" defer></script>
</head>
<body>
    <header class="page-header">
        <a class="back-link" href="../index.html">← Back</a>
        <div class="header-text">
            <h1>Serpens Nebula</h1>
            <p class="source-note">
                Aladin Lite sky map ·
                <a href="https://esahubble.org/images/heic1819c/" target="_blank" rel="noopener noreferrer">ESA/Hubble heic1819c</a>
            </p>
        </div>
    </header>

    <div id="aladin-lite-div" class="aladin-view"></div>

    <div class="map-controls">
        <div class="survey-options" role="radiogroup" aria-label="Sky survey">
            <label>
                <input id="survey-dss" type="radio" name="survey" value="P/DSS2/color" checked>
                Optical (DSS2)
            </label>
            <label>
                <input id="survey-2mass" type="radio" name="survey" value="P/2MASS/color">
                Infrared (2MASS)
            </label>
        </div>
        <label class="crossfade">
            Crossfade image
            <input id="overlay-alpha" type="range" min="0" max="1" step="0.05" value="1">
        </label>
    </div>

    <p class="credit">
        Credit: NASA, ESA, Digitized Sky Survey 2 (Acknowledgement: Davide De Martin) · Sky viewer: CDS Aladin Lite
    </p>
</body>
</html>
